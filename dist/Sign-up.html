<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./style.css" rel="stylesheet">
  <title>Welcome</title>
</head>
<body>
  
<body class="h-screen bg-gray-100 flex items-center justify-center">

  <div class="w-full max-w-6xl bg-white shadow-lg rounded-lg overflow-hidden flex">
    
    <!-- Left Image Section -->
    <div class="w-1/2 hidden md:block">
      <img src="/img/Testher.jpg" alt="Login image"
           class="w-full h-full object-cover">
    </div>

    <!-- Right Form Section -->
    <div class="w-full md:w-1/2 p-10 flex flex-col justify-center fade-in-slide">

      <h2 class="text-5xl font-bold text-gray-800 mb-6 underline">Sign In</h2>

      <form action="#" method="POST" class="space-y-5">
        <div>
          <label for="email" class="block text-gray-600 underline">Email</label>
          <input type="email" id="email" placeholder="Email@example" name="email" required
                 class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-300">
        </div>

        <div>
          <label for="password" class="block text-gray-600 underline">Password</label>
          <input type="password" id="password" placeholder="Confirm Password" name="password" required
                 class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 bg-gray-300">
        </div>

        <div class="flex justify-between items-center text-sm text-gray-500">
          <label class="flex items-center">
            <input type="checkbox" class="mr-2">
            Remember me
          </label>
          <a href="#" class="text-blue-500 hover:underline">Forgot password?</a>
        </div>

        <button type="submit"
                class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer transition duration-300">
          Sign In 
        </button>
      </form>

      <p class="mt-6 text-sm text-center text-gray-500">
        Don’t have an account? <a href="#" class="text-blue-500 hover:underline">Sign up</a>
      </p>

    </div>
  </div>

</body>
</html>
